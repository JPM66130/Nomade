version: "3.9"

services:
  nomade-api:
    build: .
    container_name: nomade-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - ENVIRONMENT=development
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
