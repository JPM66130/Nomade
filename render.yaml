services:
  - type: web
    name: nomade-api
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install fastapi uvicorn; fi
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
