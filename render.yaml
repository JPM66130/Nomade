services:
  - type: web
    name: nomade-beta
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: ORS_API_KEY
        sync: false
      - key: GRAPHOPPER_API_KEY
        sync: false