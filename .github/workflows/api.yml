name: API / AllRoad's

on:
  workflow_dispatch:   # Lancement manuel uniquement

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests
        run: |
          pytest || echo "Aucun test ou tests non configurés"

      - name: Vérifier que l'API démarre
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000 || echo "API non accessible"

      - name: Construire l'image Docker
        run: |
          docker build -t allroads-api .
